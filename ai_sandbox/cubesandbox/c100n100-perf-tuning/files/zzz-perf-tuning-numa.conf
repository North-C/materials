# /etc/systemd/system/cube-sandbox-cubelet.service.d/zzz-perf-tuning-numa.conf
# 把 Cubelet（及其派生的 Shim/VMM/vCPU 线程）限制在同一个 socket 内。
# 下面的取值对应 .90（Kunpeng 950：node0=0-95，node1=96-191，同属 socket0）。
# 其他机器请按 numactl --hardware / lscpu 换成同一 socket 内的 CPU 范围和节点。
[Service]
CPUAffinity=
CPUAffinity=0-191
NUMAPolicy=bind
NUMAMask=0-1
