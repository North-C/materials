<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="880" viewBox="0 0 1320 880" role="img" aria-labelledby="title desc">
<title id="title">Template 启动阶段整体关系</title><desc id="desc">嵌套矩形表示计时包含。同一层从左到右表示主要先后关系，框内注明并行，底部为异步工作。框大小不代表时延。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#223447;font-size:16px}.title{font-size:27px;font-weight:600}.head{font-size:19px;font-weight:600}.small{font-size:14px;fill:#526576}.muted{fill:#526576}.mono{font-family:ui-monospace,Menlo,monospace;font-size:15px}</style>
<rect width="1320" height="880" fill="#ffffff"/>
<text x="30" y="42" class="title" text-anchor="start">Template 启动阶段 · 整体关系</text>
<text x="30" y="72" class="small" text-anchor="start">v0.7.1  /  单容器 Template 恢复路径  /  框的大小不表示耗时</text>
<rect x="30" y="94" width="1260" height="54" rx="9" fill="#edf2f6" stroke="#becbd6"/>
<text x="50" y="127" class="head" text-anchor="start">客户端 create_ms：CubeAPI 前处理 ＋ 等待 Master ＋ HTTP 响应返回</text>
<rect x="30" y="166" width="1260" height="548" rx="9" fill="#f5f7fa" stroke="#9eafbf"/>
<text x="50" y="199" class="head" text-anchor="start">Master · cube-e2e</text>
<text x="1265" y="198" class="small" text-anchor="end">外框包含内框；按阅读顺序展示主要阶段</text>
<rect x="50" y="221" width="135" height="465" rx="9" fill="#e8eef5" stroke="#becbd6"/>
<text x="117" y="265" class="head" text-anchor="middle">请求准备</text>
<text x="117" y="291" class="head" text-anchor="middle">与调度</text>
<text x="117" y="344" class="small" text-anchor="middle">newContext</text>
<text x="117" y="374" class="small" text-anchor="middle">排队 / Handle</text>
<text x="117" y="404" class="small" text-anchor="middle">等待 Cubelet</text>
<rect x="200" y="221" width="900" height="465" rx="9" fill="#edf5f3" stroke="#83aaa0"/>
<text x="220" y="252" class="head" text-anchor="start">Cubelet · cubebox-service</text>
<text x="1080" y="252" class="small" text-anchor="end">参数检查之后开始计时</text>
<rect x="220" y="275" width="190" height="390" rx="9" fill="#ffffff" stroke="#a5c2ba"/>
<text x="315" y="312" class="head" text-anchor="middle">准备工作</text>
<text x="315" y="350" class="" text-anchor="middle">组 1 内并行</text>
<text x="315" y="378" class="" text-anchor="middle">createid</text>
<text x="315" y="406" class="" text-anchor="middle">appsnapshot</text>
<text x="315" y="448" class="" text-anchor="middle">组 2 内并行</text>
<text x="315" y="476" class="" text-anchor="middle">network / storage</text>
<text x="315" y="504" class="" text-anchor="middle">images / volume</text>
<text x="315" y="532" class="" text-anchor="middle">netfile / store</text>
<text x="315" y="595" class="small" text-anchor="middle">组间等待</text>
<text x="315" y="620" class="small" text-anchor="middle">每组全部结束再继续</text>
<rect x="425" y="275" width="120" height="390" rx="9" fill="#ffffff" stroke="#a5c2ba"/>
<text x="485" y="312" class="head" text-anchor="middle">cgroup</text>
<text x="485" y="365" class="small" text-anchor="middle">资源匹配</text>
<text x="485" y="399" class="small" text-anchor="middle">池分配 / 新建</text>
<text x="485" y="433" class="small" text-anchor="middle">用量基线</text>
<text x="485" y="467" class="small" text-anchor="middle">保存归属</text>
<rect x="560" y="275" width="520" height="390" rx="9" fill="#f6f1e8" stroke="#c5b391"/>
<text x="580" y="310" class="head" text-anchor="start">cubebox · 创建与就绪</text>
<text x="580" y="340" class="small" text-anchor="start">准备 spec / containerd 元数据</text>
<rect x="580" y="357" width="480" height="191" rx="9" fill="#fdfaf3" stroke="#c6b58e"/>
<text x="597" y="387" class="head" text-anchor="start">sandbox-start（累计窗口）</text>
<rect x="597" y="402" width="335" height="128" rx="9" fill="#ffffff" stroke="#c6b58e"/>
<text x="610" y="431" class="head" text-anchor="start">sandbox-create · NewTask</text>
<rect x="610" y="445" width="309" height="70" rx="9" fill="#eaf0f8" stroke="#9ab0cb"/>
<text x="764" y="472" class="" text-anchor="middle">Shim · CreatePodSandbox</text>
<text x="764" y="497" class="small" text-anchor="middle">VM 恢复 / Agent 重置 / Guest 创建</text>
<text x="997" y="442" class="small" text-anchor="middle">后续 Start</text>
<text x="997" y="469" class="small" text-anchor="middle">及状态更新</text>
<rect x="580" y="567" width="157" height="72" rx="9" fill="#ffffff" stroke="#c6b58e"/>
<text x="658" y="595" class="" text-anchor="middle">sandbox-probe</text>
<text x="658" y="620" class="small" text-anchor="middle">就绪探测</text>
<rect x="752" y="567" width="308" height="72" rx="9" fill="#ffffff" stroke="#c6b58e"/>
<text x="906" y="595" class="" text-anchor="middle">状态保存 / 宿主限额 / 其他收尾</text>
<text x="906" y="620" class="small" text-anchor="middle">含 cube-inner-cgroup</text>
<rect x="1115" y="221" width="155" height="465" rx="9" fill="#e8eef5" stroke="#becbd6"/>
<text x="1192" y="265" class="head" text-anchor="middle">Master 后处理</text>
<text x="1192" y="344" class="" text-anchor="middle">Redis 映射</text>
<text x="1192" y="374" class="" text-anchor="middle">∥</text>
<text x="1192" y="404" class="" text-anchor="middle">Spec 持久化</text>
<text x="1192" y="483" class="small" text-anchor="middle">两项并行</text>
<text x="1192" y="513" class="small" text-anchor="middle">等待完成</text>
<text x="1192" y="543" class="small" text-anchor="middle">再返回响应</text>
<rect x="30" y="737" width="1260" height="84" rx="9" fill="#fbfbfc" stroke="#aab4bf" stroke-dasharray="6 5"/>
<text x="50" y="769" class="head" text-anchor="start">异步工作 · 发出后不等待完成，可与主路径和响应重叠</text>
<text x="50" y="800" class="" text-anchor="start">Cubelet / Master 日志输出　·　Shim 事件转发　·　部分 cgroup 更新（Shim PID 入组、VM CPU 更新，按配置）</text>
<text x="30" y="853" class="small" text-anchor="start">嵌套 = 包含，不能重复相加；并行 = 等待最慢分支完成；Master probe 是传播值，不新增一段耗时。</text>
</svg>
